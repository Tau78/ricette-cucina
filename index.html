<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C06028">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ricette">
  <title>Ricette</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="media/cuoco.jpg">
  <link rel="apple-touch-icon" href="media/cuoco.jpg">
  <style>
    :root {
      --crema: #f6efe4;
      --terracotta: #c06028;
      --inchiostro: #2a2118;
      --soft: #6b5e52;
      --oro: #e8c030;
      --oro-scuro: #8a6a12;
      --salvia: #3e5641;
      --bianco: #fff;
      --pesca: #ffe0d4;
      --bordo: #e4d8c8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Avenir Next", Avenir, "Gill Sans", "Trebuchet MS", sans-serif;
      color: var(--inchiostro);
      background: var(--crema);
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { min-height: 100dvh; }
    body { overflow-x: clip; }
    .schermo, .foglio, .orologio { width: 100%; max-width: 880px; margin: 0 auto; min-height: 100dvh; }
    .preferiti { flex: 0 0 auto; }
    .testa-oggi {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      background: var(--terracotta);
      color: var(--bianco);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    }
    .cuoco { width: 72px; height: 96px; object-fit: contain; flex: 0 0 auto; }
    .testa-oggi h1 {
      margin: 0;
      flex: 1 1 160px;
      font-size: 1.25rem;
      line-height: 1.15;
      font-weight: 700;
    }
    .cerca-riga { display: flex; align-items: center; gap: 8px; flex: 1 1 100%; min-width: 0; }
    .cerca {
      flex: 1 1 auto;
      min-width: 0;
      width: 0;
      min-height: 44px;
      border: 0;
      border-radius: 24px;
      background: var(--bianco);
      color: var(--inchiostro);
      padding: 0 16px;
    }
    .icona, .preferiti {
      min-height: 44px;
      border: 1px solid var(--bianco);
      background: transparent;
      color: var(--bianco);
      border-radius: 24px;
    }
    .icona { width: 44px; font-size: 1.4rem; }
    .preferiti { padding: 0 14px; white-space: nowrap; }
    .preferiti.acceso { background: var(--bianco); color: var(--terracotta); border-color: var(--bianco); }
    .pannello {
      margin: 12px 12px 0;
      background: var(--bianco);
      border-radius: 16px;
      padding: 8px 8px 8px 12px;
      overflow: hidden;
    }
    @media (max-width: 700px) {
      .testa-oggi { display: grid; grid-template-columns: 72px minmax(0, 1fr); }
      .cerca-riga { grid-column: 1 / -1; }
    }
    .chip-riga { display: flex; align-items: center; gap: 8px; }
    .chip-riga + .chip-riga { margin-top: 8px; }
    .gruppo { width: 4.6rem; flex: 0 0 auto; font-size: 0.82rem; color: var(--soft); font-weight: 700; }
    .chip-riga { min-width: 0; }
    .scorrimento { display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0; padding-bottom: 2px; }
    .chip, .azzera, .pill {
      border: 1px solid var(--bordo);
      background: var(--bianco);
      border-radius: 22px;
      min-height: 36px;
      padding: 0 12px;
      white-space: nowrap;
    }
    .chip.attiva, .pill.attiva { background: var(--terracotta); color: var(--bianco); border-color: var(--terracotta); }
    .chip:disabled { opacity: 0.35; }
    .azzera { border: 0; color: var(--terracotta); font-weight: 700; background: transparent; }
    .badge { margin: 12px 16px 8px; font-weight: 700; }
    .griglia {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      padding: 0 12px calc(16px + env(safe-area-inset-bottom));
    }
    .carta {
      display: flex;
      gap: 10px;
      min-width: 0;
      background: var(--bianco);
      border-radius: 16px;
      padding: 12px;
      text-align: left;
      min-height: 108px;
    }
    .barra { width: 6px; border-radius: 6px; background: var(--oro); flex: 0 0 auto; }
    .carta .corpo { min-width: 0; flex: 1; }
    .nome-riga { display: flex; align-items: flex-start; gap: 4px; }
    .nome-riga strong { flex: 1; font-size: 1rem; line-height: 1.2; }
    .cuore {
      border: 0;
      background: transparent;
      color: var(--terracotta);
      font-size: 1.25rem;
      line-height: 1;
      min-width: 36px;
      min-height: 36px;
      padding: 0;
    }
    .sotto, .etichette { margin: 2px 0 0; color: var(--soft); font-size: 0.82rem; }
    .sotto { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stato { margin: 6px 0 0; color: var(--oro-scuro); font-weight: 700; font-size: 0.95rem; }
    .vuoto { text-align: center; padding: 18px 16px 32px; }
    .vuoto p { font-weight: 700; }
    .vuoto button {
      border: 0;
      background: var(--terracotta);
      color: var(--bianco);
      border-radius: 24px;
      min-height: 44px;
      padding: 0 18px;
    }
    .foglio { display: flex; flex-direction: column; background: var(--crema); }
    .testa-ricetta {
      background: var(--terracotta);
      color: var(--bianco);
      padding: calc(10px + env(safe-area-inset-top)) 12px 12px;
      text-align: center;
    }
    .testa-ricetta .riga { display: flex; }
    .oggi {
      border: 0;
      background: transparent;
      color: var(--bianco);
      font-weight: 700;
      min-height: 36px;
      padding: 0 4px;
    }
    .testa-ricetta h1 { margin: 4px 0; font-size: clamp(1.35rem, 4vw, 1.8rem); line-height: 1.1; }
    .prep { margin: 0; font-size: 0.95rem; }
    .corpo { flex: 1; overflow: auto; padding: 12px 12px 8px; }
    .blocco, details.sezione {
      background: var(--bianco);
      border-radius: 16px;
      padding: 8px 14px 12px;
      margin-bottom: 12px;
    }
    .blocco h2, summary, .calcola-testa {
      color: var(--terracotta);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    summary { cursor: pointer; padding: 8px 0; }
    .nota-tempi { margin: 0 0 8px; color: var(--soft); font-size: 0.82rem; }
    .pillole { display: flex; flex-wrap: wrap; gap: 8px; }
    .campi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .campi label { display: flex; flex-direction: column; gap: 2px; font-size: 0.75rem; color: var(--soft); }
    .campi input, .peso {
      min-height: 36px;
      border: 1px solid var(--bordo);
      border-radius: 12px;
      padding: 0 10px;
      background: var(--bianco);
      color: var(--inchiostro);
      font-size: 1rem;
    }
    .campi input.errato { background: var(--pesca); border-color: var(--terracotta); }
    .errore { margin: 8px 0 0; color: var(--terracotta); font-weight: 700; }
    .dose {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 7px 0;
      font-size: 1.05rem;
    }
    .dose.spunta { color: var(--salvia); text-decoration: line-through; }
    .passo { border: 0; background: transparent; text-align: left; width: 100%; padding: 8px 0 0; font-size: 1.05rem; }
    .passo.attivo { color: var(--terracotta); font-weight: 700; }
    .passo-nota { margin: 0; color: var(--soft); font-size: 0.9rem; }
    .passo-min { margin: 2px 0 8px; color: var(--oro-scuro); font-weight: 700; font-size: 0.9rem; }
    .adesso h2 { margin: 0; font-size: 1.35rem; }
    .adesso p { margin: 4px 0 0; color: var(--soft); }
    .tempo {
      margin: 8px 0;
      color: var(--terracotta);
      font-weight: 700;
      font-size: 2.25rem;
      font-variant-numeric: tabular-nums;
    }
    .azioni {
      display: flex;
      gap: 8px;
      padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    }
    .azioni button {
      flex: 1;
      min-height: 64px;
      border: 0;
      border-radius: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .fatto { background: var(--terracotta); color: var(--bianco); }
    .avvia { background: var(--oro); color: var(--inchiostro); }
    .orologio {
      min-height: 100dvh;
      background: var(--terracotta);
      color: var(--crema);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: calc(28px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom));
    }
    .orologio .tempo {
      color: var(--bianco);
      font-size: clamp(3.4rem, 14vw, 4.5rem);
      margin: 0;
    }
    .orologio h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2rem); color: var(--bianco); }
    .orologio .nota { margin: 0; max-width: 34rem; font-size: 1.05rem; }
    .poi { margin: 8px 0 0; color: var(--oro); font-weight: 700; font-size: 1.15rem; }
    .torna { margin: 16px 0 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="calcola.js"></script>
  <script src="ricette.js"></script>
  <script src="app.js"></script>
</body>
</html>
